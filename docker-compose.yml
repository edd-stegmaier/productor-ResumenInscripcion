services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: plataforma-educativa-resumen:latest
    container_name: plataforma-educativa-resumen
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8081}:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-localhost}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:-guest}
      DB_USERNAME: ${DB_USERNAME:-ADMIN}
      DB_PASSWORD: ${DB_PASSWORD:-}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:oracle:thin:@<tns_alias>?TNS_ADMIN=/opt/oracle/wallet}
      DB_WALLET_PATH: /opt/oracle/wallet
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-5}
      DB_CONNECTION_TIMEOUT: ${DB_CONNECTION_TIMEOUT:-30000}
      DB_IDLE_TIMEOUT: ${DB_IDLE_TIMEOUT:-600000}
      DB_MAX_LIFETIME: ${DB_MAX_LIFETIME:-1800000}
    volumes:
      - ./wallet:/opt/oracle/wallet:ro

